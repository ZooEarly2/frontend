<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저장된 값 보기</title>
<!--
  진단용 한 장짜리 페이지.

  연속 출석 배지가 안 뜬다는데 코드는 전 계층이 맞아서, 그 기기에 실제로 무엇이
  저장돼 있는지를 봐야 했다. 폰에서는 개발자 도구를 못 여니 같은 도메인에 페이지를
  하나 두는 것이 가장 빠르다 — localStorage 는 도메인마다 따로라 여기서만 읽힌다.

  남의 것을 보는 페이지가 아니다. 이 주소를 여는 사람은 자기 기기에 자기가 남긴
  값을 보는 것뿐이고, 서버로는 아무것도 보내지 않는다.
-->
<style>
  :root {
    --bg: #17150f; --panel: #221e17; --edge: #383026;
    --ink: #f0eae0; --dim: #a2988a; --ok: #7fd1c1; --no: #f2a0a8; --num: #ffd36e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 18px 60px; background: var(--bg); color: var(--ink);
    font-family: system-ui, 'Malgun Gothic', sans-serif; line-height: 1.6;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { margin: 0 0 22px; color: var(--dim); font-size: 14px; }
  .card {
    border: 1px solid var(--edge); border-radius: 12px; background: var(--panel);
    padding: 16px; margin-bottom: 14px;
  }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid #2e2820; }
  .row:first-of-type { border-top: 0; }
  .row b { font-weight: 600; color: var(--dim); font-size: 14px; }
  .row span { font-family: ui-monospace, monospace; font-size: 14px; text-align: right; word-break: break-all; }
  .big { font-size: 34px; font-weight: 700; color: var(--num); font-family: ui-monospace, monospace; }
  .ok { color: var(--ok); } .no { color: var(--no); }
  pre {
    margin: 0; padding: 14px; border: 1px solid var(--edge); border-radius: 10px;
    background: #100e0a; color: var(--dim); font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
  }
  .why { font-size: 14px; color: var(--dim); }
  .why b { color: var(--ink); }
  a { color: var(--ok); }
</style>
</head>
<body>
  <h1>저장된 값 보기</h1>
  <p class="sub">이 기기에 남아 있는 값입니다. 서버로는 아무것도 보내지 않습니다.</p>
  <div id="out"></div>

<script>
const KEY = 'zooearly.v1';
const out = document.getElementById('out');

function dayKey(d) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
const today = dayKey(new Date());
const yesterday = dayKey(new Date(Date.now() - 86400000));

let raw = null;
try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }

if (!raw) {
  out.innerHTML =
    '<div class="card"><p class="why"><b>저장된 값이 없습니다.</b><br>' +
    '아직 이 기기에서 앱을 쓴 적이 없거나, 브라우저 저장 데이터를 지우셨습니다.</p></div>';
} else {
  let s = {};
  try { s = JSON.parse(raw); } catch (e) { s = {}; }

  const streak = typeof s.streak === 'number' ? s.streak : null;
  const date = s.streakDate ?? null;
  const alive = date === today || date === yesterday;
  const shown = alive && streak ? streak : 0;

  const rows = [
    ['이름', s.profile?.nickname ?? '(없음)'],
    ['오늘 날짜', today],
    ['저장된 날짜(dateKey)', s.dateKey ?? '(없음)'],
    ['오늘 마친 것', (s.completed ?? []).join(', ') || '(없음)'],
    ['연속 일수(streak)', streak === null ? '(필드 자체가 없음)' : String(streak)],
    ['마지막으로 마친 날', date ?? '(없음)'],
  ];

  let why;
  if (streak === null || date === null) {
    why = '<b class="no">아직 한 번도 기록되지 않았습니다.</b><br>' +
      '연속 출석은 앱을 여는 것이 아니라 <b>시나리오 하나를 끝까지 마쳐서 완료 화면에 닿을 때</b> ' +
      '처음 생깁니다. 이 기능이 배포되기 전에 마친 것은 기록에 없습니다.';
  } else if (!alive) {
    why = '<b class="no">기록이 끊겼습니다.</b><br>마지막으로 마친 날이 ' + date +
      ' 이라 오늘(' + today + ')과 이어지지 않습니다. 다음에 하나를 마치면 1일째로 다시 시작합니다.';
  } else {
    why = '<b class="ok">살아 있습니다.</b><br>홈 화면 이름 옆에 <b>' + shown +
      '일째</b> 가 떠 있어야 맞습니다. 안 떠 있다면 화면이 옛 버전입니다 — 새로고침해 주세요.';
  }

  out.innerHTML =
    '<div class="card" style="text-align:center">' +
    '<div class="big">' + shown + '</div>' +
    '<div class="why">홈에 떠야 할 숫자</div></div>' +
    '<div class="card">' + rows.map(function (r) {
      return '<div class="row"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>';
    }).join('') + '</div>' +
    '<div class="card why">' + why + '</div>' +
    '<div class="card"><b class="why">원본</b><pre>' +
    raw.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }) +
    '</pre></div>' +
    '<p class="sub" style="margin-top:18px"><a href="/">앱으로 돌아가기</a></p>';
}
</script>
</body>
</html>
